aid: general-fusion
name: General Fusion
description: 'General Fusion is a Canadian fusion energy company founded in 2002 by
  physicist Dr. Michel Laberge and headquartered in Richmond, British Columbia, in the
  Vancouver area. It is developing Magnetized Target Fusion (MTF), an approach that
  combines plasma formation, mechanical compression by a liquid metal liner, and practical
  heat capture for electricity generation. The company operates LM26, which it describes
  as the world''s largest and most powerful operational fusion plasma injector, and
  reports 24 plasma prototypes, more than 200,000 plasma experiments, 35+ peer-reviewed
  papers, and roughly 210 issued and pending patents. In July 2026 General Fusion completed
  a business combination with Spring Valley Acquisition Corp. III and became the first
  publicly listed fusion energy company, trading on Nasdaq under the ticker GFUZ. It
  is an energy hardware and research company rather than a software or API provider:
  it publishes no public developer portal, API documentation, SDKs, or machine-readable
  API contracts. Its only machine-readable public surfaces are a Yoast-generated llms.txt
  and the WordPress REST discovery index behind its marketing site.'
